[env:bw_swan_r5]
; Pinned: the BLE module UART (LPUART1 on A0/A3, clocked from HSI in main.cpp) never transmitted with platform 20.x
; (framework-arduinoststm32 4.30000), but works with 19.4.0 (4.21100), as in the dewater firmware.
platform = ststm32@19.4.0
board = bw_swan_r5
framework = arduino
monitor_speed = 9600


upload_protocol = dfu
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_VID=0x0483
    -D USBD_PID=0x5740
    -D USB_MANUFACTURER="Blues Wireless"
    -D USB_PRODUCT="\"Blues Swan R5\""
    ; Fits one whole BLE message, so writes to the HM-10 rarely wait on the UART.
    -D SERIAL_TX_BUFFER_SIZE=256

lib_deps = 
    bblanchon/ArduinoJson